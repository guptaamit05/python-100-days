<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Blog</title>
</head>
<body>

    <h1>My Blog:</h1>
    {% if id %}
    {% for post in posts %}

        {% if id == post.id  %}
            <h2>{{post.title}}</h2>
            <p>{{post.body}}</p>
            <a href="{{ url_for('get_blog') }}">Back</a>

        <hr />

        {%endif%}
    {% endfor %}

    {% else %}
        {% for post in posts %}
            <h2>{{post.title}}</h2>
            <p>{{post.body}}</p>
            <a href="{{ url_for('get_blog', id=post.id) }}">Go to Blog</a>
            <hr />
        {% endfor %}
    {% endif %}
    
</body>
</html>
