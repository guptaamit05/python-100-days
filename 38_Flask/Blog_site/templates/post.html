{% include 'header.html' %}

        <!-- Post Content-->
        <article class="mb-4">
            <div class="container px-4 px-lg-5">
                <div class="row gx-4 gx-lg-5 justify-content-center">
                    
                    <div class="col-md-10 col-lg-8 col-xl-7">
                        {% if id %}
                        {% for post in posts %}

                            {% if id == post.id  %}
                        <h2 class="section-heading">{{ post.title }}</h2>
                        <p class="post-meta">
                            Posted by
                            <a href="#!">Amit's G</a>
                            on {{post_time}}
                        </p>
                        <p>{{ post.body}}</p>
                                <a href="{{ url_for('home') }}">Back</a>

                         {%endif%}
                        {% endfor %}
                {% endif %}
                        
                    </div>
                </div>
            </div>
        </article>
{% include 'footer.html' %}

    </body>
</html>
